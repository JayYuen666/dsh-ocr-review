# 依赖更新：action 一条线。
#
# action 侧覆盖本仓的全部 workflow 引用：这些引用都钉了 commit SHA，Dependabot 提的 PR
# 会把「换了哪个提交」变成一次可评审的 diff。
#
# 这里刻意**没有** npm 更新块：本仓依赖只有两类，两类都不该由更新机器人改动。
# 一是工具链与大部分宿主依赖写成 catalog:，那条范围的真源在伞根的 pnpm-workspace.yaml；
# 二是其余依赖写成字面版本，而每一枚都在本仓 pnpm-workspace.yaml 的 overrides 里被钉死
# （宿主族统一 0.2.1-rc.3 那条线）。Dependabot 对第二类提的 PR 会被 overrides 解析回原版本，
# 合进去也不改变安装树——留着它只会造出「看起来升了、实际没升」的 PR。要升这些版本只能在
# 伞根改真源，再投影下来。
#
# 但「本仓不会出现 npm 机器人 PR」这句话**不由这个文件保证**：Dependabot security updates
# 是仓库设置里独立开着的，不读本文件、也不需要 npm 配置块，仍会针对漏洞依赖提 PR，而那些
# PR 同样被 overrides 解析回原版本。要真正关掉它得去 Settings → Code security 里处理 npm
# 那条 security updates，改这里的 yml 没有用。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # 本仓引用的 action 全部放进一组，避免每个 action 各占一个 PR 去抢同一个名额。
      # 最后那条 `*` 是兜底而不是随手写的：上面几条按 `<owner>/<repo>` 逐项枚举，一旦
      # workflow 里新增未列出的 owner（未来的 docker/*、softprops/* 之类），那个 action
      # 会脱离分组、单独生成 PR 并和 open-pull-requests-limit 抢名额，而没有任何机制能
      # 暴露这种漂移。兜底通配同样覆盖 `owner/repo/subpath` 形式（codeql-action 的 init、
      # analyze、upload-sarif 就是三条不同的引用，但归同一个 owner/repo 条目）。
      actions:
        patterns:
          - "actions/*"
          - "pnpm/*"
          - "github/codeql-action*"
          - "ossf/scorecard-action*"
          - "*"
    # 只让机器人做小版本与补丁：major 升级往往要同步改 workflow（node 版本、权限、输入
    # 参数），一个分组 PR 里很难一次验证完，留给人工发起更稳。
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
