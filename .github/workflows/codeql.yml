# CodeQL：两格并跑。
#
# javascript-typescript 扫源码；actions 扫 .github/workflows/*.yml —— 后者正是
# 本仓这一层最需要的一种检查：工作流里的表达式注入、过度权限、可被 fork PR 触发的
# 危险形态，都是「代码全绿但门禁本身有洞」那一类。
#
# 不给 build-mode：JS/TS 与 actions 都走默认的 none，不需要编译。
name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动入口：修完一条告警想立刻复验时，不必等下一周的 cron。
  workflow_dispatch: {}
  schedule:
    - cron: "23 4 * * 1"
# 组键带事件名：周度扫描与 main 上的 push 落在不同组，前者不会因为一次 push 被取消——
# 那一跑是「上游变了没有」的唯一信号，被取消等于这一周没量到。
# 取消留给同分支的 push 与同一 PR 的新提交：被取消的运行不产生 SARIF，但排在后面的那一次
# 才是还有人等它结论的那一份。
# 已知残差：schedule 与 push@main 会在同一个 ref 上并发分析，而 category 只按语言。
# codeql-action 把这个 category 原样写进 SARIF 的 automationDetails.id
# （src/upload-lib.ts 的 getAutomationID），落点还带着被分析的那个 commit——两次分析的是不同
# commit，各记各的账；同一个 commit 传两次则是同一份结果被替换，不丢信息。所以这一档不构成
# 「并发上传互相覆盖」，也就不必把 category 按事件拆开：拆成两个来源反而打断同一份分析的告警去重。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
# 工作流级只给读；写入权限挂在 job 上，因为只有上传 SARIF 那一步需要它。
permissions:
  contents: read
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # 30 分钟对两格并跑的完整分析偏紧：actions 那一格要拉查询包，javascript-typescript
    # 那一格在依赖装好之后还要做数据库构建。超时与「有告警」在结论上都表现为红，
    # 但前者不告诉你任何关于代码的事，排查成本高。
    timeout-minutes: 45
    permissions:
      # 上传 SARIF 到 code scanning 面板所必需。
      security-events: write
      # 不写 packages: read——本文件没有任何 packs / queries 输入，init 与 analyze 只用
      # codeql-action 自带的默认套件。官方 code scanning 起始工作流把这枚权限标为
      # 「required to fetch internal or private CodeQL packs」，本仓没有那一类 pack，它就是多给的。
      contents: read
      # 私有仓库下 init/analyze 要读本次运行的工作流元数据（判断该 ref 是否已有分析、
      # 回写状态）。缺它时表现为上传/状态回写报权限不足，而不是一条看得懂的报错。
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # 两个标识都按官方清单写死：javascript-typescript 覆盖 JS 与 TS；
        # actions 覆盖本仓 .github/workflows 下的工作流文件。
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本工作流 checkout 之后只有 CodeQL 的 init/analyze 两步，不跑 install、构建或测试，
          # 也没有 git 写动词——它不需要 git 凭据，所以 token 不留在 .git/config 里。
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        # fork 来的 pull_request 拿到的 GITHUB_TOKEN 恒为只读，job 上的 security-events: write
        # 在那一档不生效。失败形态在钉住的那一版源码里可读：src/upload-lib.ts 收到 403 后
        # core.warning 一句便无条件 throw，src/analyze-action.ts
        # 的 catch 随即 core.setFailed —— 这一步会红，不会降级成告警。
        # 只对 fork PR 容错，其余事件仍判红；跳过整步更糟：被跳过的必检在分支保护里记作通过，
        # 外部贡献的代码就成了「未扫描即绿」，合并前盲区原样留着。
        # head.repo.fork 放在 && 右侧：非 pull_request 事件取不到它，短路后那些事件恒为 false。
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}
