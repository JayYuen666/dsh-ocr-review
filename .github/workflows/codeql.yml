# CodeQL：两格并跑。
#
# javascript-typescript 扫源码；actions 扫 .github/workflows/*.yml —— 后者正是
# 本仓这一层最需要的一种检查：工作流里的表达式注入、过度权限、可被 fork PR 触发的
# 危险形态，都是「代码全绿但门禁本身有洞」那一类。
#
# 不给 build-mode：JS/TS 与 actions 都走默认的 none，不需要编译。
name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动入口：修完一条告警想立刻复验时，不必等下一周的 cron。
  workflow_dispatch: {}
  schedule:
    - cron: "23 4 * * 1"
# 组键带事件名：周度扫描与 main 上的 push 落在不同组，前者不会因为一次 push 被取消。
# 取消只留给同分支的 push。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
# 工作流级只给读；写入权限挂在 job 上，因为只有上传 SARIF 那一步需要它。
permissions:
  contents: read
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # 30 分钟对两格并跑的完整分析偏紧：actions 那一格要拉查询包，javascript-typescript
    # 那一格在依赖装好之后还要做数据库构建。超时与「有告警」在结论上都表现为红，
    # 但前者不告诉你任何关于代码的事，排查成本高。
    timeout-minutes: 45
    # fork 来的 pull_request 拿到的 GITHUB_TOKEN 恒为只读，下面 job 级的
    # security-events / packages 写权限在那一档里根本不生效：analyze 上传 SARIF 会在
    # 认证处报 Resource not accessible by integration，把外部贡献者的 PR 检查无条件判红。
    # 判据用「PR 的 head 仓库是不是本仓」而不是 head.repo.fork：后者在非 pull_request
    # 事件（push / schedule / workflow_dispatch）上取不到值，写成 !fork 会让那些事件整体跳过。
    # 合并前的分析由 push 到 main 那一轮覆盖，不是空白。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # 上传 SARIF 到 code scanning 面板所必需。
      security-events: write
      # CodeQL 查询包要读 registry 上的 pack。
      packages: read
      contents: read
      # 私有仓库下 init/analyze 要读本次运行的工作流元数据（判断该 ref 是否已有分析、
      # 回写状态）。缺它时表现为上传/状态回写报权限不足，而不是一条看得懂的报错。
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # 两个标识都按官方清单写死：javascript-typescript 覆盖 JS 与 TS；
        # actions 覆盖本仓 .github/workflows 下的工作流文件。
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本工作流 checkout 之后只有 CodeQL 的 init/analyze 两步，不跑 install、构建或测试，
          # 也没有 git 写动词——它不需要 git 凭据，所以 token 不留在 .git/config 里。
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
